name: CI

# F-06 remediation (PRR Phase 13) — the authoritative CI gate for DigiHostel.
# Runs on every pull request and every push to main; every step must pass
# for the workflow to succeed (no step is advisory/continue-on-error).
#
# Versions are pinned to exactly what this repository's own development
# environment resolves today (Node 24.19.0, pnpm 11.25.0 via corepack,
# Supabase CLI 2.116.0) — see docs/current-state.md's own "no project-level
# version pin recorded yet" note. This workflow is the first place those
# versions become pinned; it does not silently upgrade anything.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Supabase (applies all committed migrations)
        run: supabase start

      - name: Run pgTAP (RLS/authorization database tests)
        run: supabase test db

      - name: Export local Supabase connection details
        # F-07B fix: `supabase status -o env` quotes every value
        # (`DB_URL="postgresql://..."`), but $GITHUB_ENV takes everything
        # after the first `=` as the literal value verbatim — it does not
        # strip shell-style quoting. Appending the CLI's raw output directly
        # made every downstream env var (SUPABASE_URL included) contain
        # literal quote characters, which is why `pnpm exec vitest run`
        # below failed with "Invalid supabaseUrl: Must be a valid HTTP or
        # HTTPS URL" on every run of this workflow to date (confirmed: this
        # step has never actually succeeded, on this push or the prior one).
        # Strips the surrounding quotes before appending — the same values,
        # just in the format $GITHUB_ENV actually expects.
        run: supabase status -o env | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Run test suite (unit + real-Postgres integration + real-Supabase-Auth boundary tests; DATABASE_URL/SUPABASE_URL/SUPABASE_ANON_KEY/SUPABASE_SERVICE_ROLE_KEY set from the step above)
        # QG-05 (F-QG05-04) closure: SUPABASE_SERVICE_ROLE_KEY is the last of
        # the four env vars forceSignOutEnforcement.integration.test.ts and
        # identityAdminBoundary.integration.test.ts gate on
        # (HAS_REAL_SUPABASE_AUTH). It was already being produced by the
        # "Export local Supabase connection details" step above (as
        # SERVICE_ROLE_KEY) exactly like DB_URL/API_URL/ANON_KEY, but was
        # never forwarded into this step's env block, so those two real
        # Supabase Auth Admin API boundary suites silently skipped on every
        # CI run to date. This is the CI job's own ephemeral local Supabase
        # instance (started fresh by `supabase start` above, torn down at
        # the end of the job) — SERVICE_ROLE_KEY here is the Supabase CLI's
        # well-known, publicly-documented local demo key (identical on every
        # `supabase start` anywhere), never a project secret, so this
        # requires no GitHub Actions secret and carries no fork-PR exposure
        # risk.
        run: pnpm exec vitest run
        env:
          DATABASE_URL: ${{ env.DB_URL }}
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}

      - name: Build
        run: pnpm run build

  deploy-api:
    name: Deploy apps/api
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # QG-06 remediation (environment-labeling honesty): this job has always
    # deployed to the Render service actually named `digihostel-api-staging`
    # (confirmed live — RENDER_DEPLOY_HOOK_URL is a repo-level secret, so
    # this relabel from the previous `production` has zero behavioral
    # effect, only correcting which GitHub Environment's deployment history
    # this activity is attributed to). This job does NOT deploy to a
    # genuinely separate production service — none is provisioned yet (see
    # docs/runbooks/production-deployment.md and the QG-06 remediation
    # reports). Do not treat this job's success as production deployment.
    environment: staging
    steps:
      # ADR-021 + F-06 Phase 3 — apps/api deploys to a persistent-process
      # host (selected: Render; see docs/runbooks/production-deployment.md
      # §3), never Vercel. Render builds the image itself, server-side, from
      # apps/api/Dockerfile — this job only triggers that build via Render's
      # Deploy Hook, matching this workflow's existing pattern
      # (deploy-migrations.yml) of "GitHub Actions triggers the deploy, the
      # platform performs it," rather than building/pushing an image from
      # CI itself. Until RENDER_DEPLOY_HOOK_URL is configured (it isn't
      # yet — no Render service has been provisioned), this step fails fast
      # and clearly rather than doing anything partial.
      - name: Trigger Render deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not configured — no persistent-process host has been provisioned yet (see docs/runbooks/production-deployment.md)."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
