kind = "mobile"
previewPath = "/"
title = "School Companion"
description = "A secure school companion mobile app for parents and students, bringing leave approvals, digital library passes, student status, and school communications into one calm, trustworthy experience."
version = "1.0.0"
id = "artifacts/school-companion-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18562

[services.development]
run = "pnpm --filter @workspace/school-companion-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/school-companion-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/school-companion-mobile", "run", "serve" ]

[services.env]
PORT = "18562"
BASE_PATH = "/"
