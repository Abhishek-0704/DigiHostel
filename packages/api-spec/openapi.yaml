        - role
        - hostelId
        - hostelName
        - status
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/StaffAdminRole" }
        hostelId: { type: string, format: uuid, nullable: true }
        hostelName: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/StaffAdminStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

