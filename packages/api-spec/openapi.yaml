openapi: 3.1.0
info:
  title: DigiHostel API
  version: 0.1.0
  description: >
    Source contract for the DigiHostel API (ADR-007). Health check plus the
    first two real business workflows, Parent Leave Approval and Student Leave
    Request creation/viewing (docs/leave-approval-workflow.md).
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness check — is this process alive
      description: >
        Never touches the database — stays correct even if Postgres is
        briefly unreachable. This is the endpoint a deployment host's own
        container-restart health check should target (F-06).
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check — can this instance serve production traffic
      description: >
        Verifies the one dependency every route and every pg-boss worker
        shares (Postgres), via a trivial query — never a business query
        (F-06). Never returns the underlying error's message/stack.
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: Not ready — a required dependency is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyStatus"

  /auth/otp/request:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: >
        Request an OTP for parent/guardian login (F-02 remediation, ADR-020's
        required eligibility pre-check)
      description: >
        Resolves rollNumber + relationshipType to an authoritative parent
        phone number server-side and, if eligible, dispatches an OTP to it.
        The response is always the same shape regardless of eligibility
        (anti-enumeration) — the client never learns whether a given roll
        number/relationship is registered. No phone number is ever accepted
        from or returned to the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpBody"
      responses:
        "200":
          description: >
            A challenge id was issued — this does NOT necessarily mean an OTP
            was actually sent (see description)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify an OTP challenge and obtain a Supabase session
      description: >
        Verifies the code against the phone number bound to challengeId
        server-side. On success, returns real Supabase session tokens for the
        client to adopt via supabase.auth.setSession() — the client never
        calls Supabase's own OTP endpoints directly. Never distinguishes an
        unknown/expired/exhausted/ineligible challenge from a genuinely wrong
        code — all fail identically (anti-enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpBody"
      responses:
        "200":
          description: Verified — a real Supabase session for the client to adopt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerificationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid or expired code, or an unknown/exhausted/ineligible challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /auth/staff/audit-events:
    post:
      operationId: recordStaffAuthEvent
      tags: [auth]
      summary: >
        Record a staff authentication event in the audit trail (Reception
        Dashboard Prompt 1 — Authentication Infrastructure)
      description: >
        Staff password sign-in and native TOTP MFA happen via direct
        browser-to-Supabase-Auth calls (ADR-024) — this backend never
        observes them as they happen. This endpoint lets the already-
        authenticated caller report that one occurred, so it lands in
        DigiHostel's own audit_logs trail (not just Supabase's internal
        auth.audit_log_entries, which already captures the raw attempt
        regardless of this endpoint). Only events a caller can report while
        still holding a valid bearer token are supported here —
        sign-in-failure and session-expiry events have no valid token to
        authenticate the report with, and are covered by Supabase's own
        auth.audit_log_entries instead (see
        apps/reception-dashboard/docs/authorization.md).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAuthEventBody"
      responses:
        "204":
          description: Recorded (best-effort — see description)
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /devices/challenge:
    post:
      operationId: requestDeviceChallenge
      tags: [devices]
      summary: >
        Request a device-registration challenge (ADR-003 implementation)
      security: [{ bearerAuth: [] }]
      description: >
        Server-controlled first step of trusted-device registration: issues a
        single-use, short-lived, cryptographically random nonce bound to the
        caller's own parent identity. The client passes this nonce into the
        platform attestation call (Play Integrity on Android) and submits the
        resulting token to POST /devices/register — the client is never the
        authority for the challenge value itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestDeviceChallengeBody"
      responses:
        "200":
          description: A real, server-issued challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceChallenge"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Authenticated caller is not a parent/guardian
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /devices/register:
    post:
      operationId: registerDevice
      tags: [devices]
      summary: >
        Submit platform attestation to complete device registration (ADR-003
        implementation)
      security: [{ bearerAuth: [] }]
      description: >
        Redeems a previously-issued, single-use challenge and verifies the
        submitted attestation token server-side (Google Play Integrity
        Standard API on Android) before ever creating a trusted_devices row.
        The client can never self-declare trust — every outcome other than a
        genuine, server-verified PASS leaves the device untrusted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceBody"
      responses:
        "200":
          description: Attestation verified — the device is now trusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustedDevice"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: >
            Unauthenticated, or the challenge is invalid/expired/already
            consumed/belongs to a different caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: Attestation was verified but rejected by policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "502":
          description: The attestation provider could not be reached/verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: No attestation provider is configured in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /leave-requests:
    post:
      operationId: createLeaveRequest
      tags: [leave]
      summary: Create a leave request (authenticated student, for themselves only)
      description: >
        Creates the request in its initial `pending` state only — this does
        NOT notify a parent/guardian, and does NOT schedule any escalation
        job (Reception-Initiated Parent Approval correction). Parent
        involvement begins only once an authorized staff member explicitly
        calls `POST /leave-requests/{leaveRequestId}/send-for-parent-approval`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeaveRequestBody"
      responses:
        "201":
          description: Created — the new leave request in its initial (pending) state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: listLeaveRequests
      tags: [leave]
      summary: >
        List leave requests visible to the authenticated caller — their own
        (student), or every linked student's (parent/guardian, G-05)
      description: >
        Scope is derived entirely from the authenticated caller's own
        resolved profile, never a client-supplied filter. An authenticated
        student receives only their own requests. An authenticated
        parent/guardian receives every leave request belonging to a student
        they have a `parent_student_relationships` link to (any
        relationship_type, per ADR-016 Model C — escalation order does not
        restrict visibility). An unrelated/unlinked parent receives an empty
        array, not an error — there is no id parameter here for a caller to
        probe, so no anti-enumeration handling applies (unlike
        GET /leave-requests/{leaveRequestId}). Any other authenticated role
        (staff) receives 403.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: >
            The caller's own (student) or linked students' (parent/guardian)
            leave requests, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /leave-requests/queue:
    get:
      operationId: listStaffLeaveQueue
      tags: [leave]
      summary: >
        Staff-only: the Reception Dashboard's operational leave-request queue
        (Phase 3, Prompt 7A)
      description: >
        Requires an AAL2 (MFA-verified) staff session with role
        reception_warden, hostel_admin, or super_admin — library_incharge has
        no grant on leave_requests and receives 403, matching
        POST /leave-requests/{leaveRequestId}/expire's existing role set.
        reception_warden and hostel_admin see only leave requests belonging
        to students in their own assigned hostel, resolved entirely
        server-side from the authenticated caller's own staff row — never a
        client-supplied filter; super_admin sees every hostel's requests.
        Ordered newest-created first, with the leave request id as a stable
        secondary sort key so realtime updates never reorder unrelated rows.
        Each item is enriched with the minimum student/hostel/room context
        the queue table needs (roll number, full name, hostel name, room
        number) via existing, already-authorized joins — never any parent
        identity, contact detail, or SAP/mentor-approval data, neither of
        which this endpoint has any access to.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's operationally-visible leave request queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffLeaveQueueItem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /leave-requests/{leaveRequestId}:
    get:
      operationId: getLeaveRequest
      tags: [leave]
      summary: >
        Get a leave request — authenticated owning student, or authenticated
        parent/guardian (relationship-checked)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      responses:
        "200":
          description: The leave request, if the caller is authorized to see it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /leave-requests/{leaveRequestId}/events:
    get:
      operationId: listLeaveRequestEvents
      tags: [leave]
      summary: >
        Get a leave request's immutable approval-event timeline (Approval
        History / Parent Approval Session Workspace) — authenticated owning
        student, authenticated parent/guardian (relationship-checked), or
        authenticated staff (reception_warden/hostel_admin/super_admin,
        AAL2-required, hostel-scoped). Same authorization/anti-enumeration
        shape as GET /leave-requests/{leaveRequestId} for student/parent;
        staff access mirrors GET /leave-requests/queue's hostel-scoping
        (Phase 3 Prompt 7B).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      responses:
        "200":
          description: >
            The leave request's approval events, oldest first. Never includes
            which specific parent/guardian/staff member acted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveApprovalEvent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /leave-requests/{leaveRequestId}/approve:
    post:
      operationId: approveLeaveRequest
      tags: [leave]
      summary: Approve a leave request
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveDecisionRequest"
      responses:
        "200":
          description: Approved — the leave request's authoritative new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /leave-requests/{leaveRequestId}/reject:
    post:
      operationId: rejectLeaveRequest
      tags: [leave]
      summary: Reject a leave request
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveDecisionRequest"
      responses:
        "200":
          description: Rejected — the leave request's authoritative new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /leave-requests/{leaveRequestId}/send-for-parent-approval:
    post:
      operationId: startParentApproval
      tags: [leave]
      summary: >
        Staff-only: explicitly transition a leave request from `pending`
        into the parent approval/escalation lifecycle (Reception-Initiated
        Parent Approval correction). Never automatic — creating a leave
        request (`POST /leave-requests`) no longer schedules this on its
        own; a Reception Warden/Hostel Admin/Super Admin must call this
        endpoint explicitly before any parent notification is dispatched.
      description: >
        Requires an AAL2 (MFA-verified) staff session with role
        reception_warden, hostel_admin, or super_admin — library_incharge
        has no grant on leave_requests and receives 403, matching every
        other staff-only leave-request transition. reception_warden/
        hostel_admin are hostel-scoped to the leave request's own student;
        super_admin is unscoped. Conditionally transitions `pending` to the
        first real escalation stage — never any other current status,
        including a second concurrent call for the same leave request (the
        underlying conditional database UPDATE is what makes "exactly one
        caller can ever succeed" a server-enforced invariant, not a
        frontend one): a losing concurrent call, or any call against a
        request that is not currently `pending`, receives 409 Conflict.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      responses:
        "200":
          description: >
            Parent approval started — the leave request's authoritative new
            state (the first real escalation stage).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /leave-requests/{leaveRequestId}/expire:
    post:
      operationId: expireLeaveRequest
      tags: [leave]
      summary: >
        Staff-only: explicitly mark a leave request expired from
        manual_verification (ADR-019 §2). Never automatic — no scheduled job
        may perform this transition.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      responses:
        "200":
          description: Expired — the leave request's authoritative new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /leave-requests/{leaveRequestId}/exit-authorization:
    post:
      operationId: authorizeExit
      tags: [leave]
      summary: >
        Staff-only: record that a student has physically left the hostel for
        an already-approved leave request (Phase 3, Prompt 7C — Student
        Verification & Exit Authorization). The final Reception-side
        checkpoint before departure.
      description: >
        Requires an AAL2 (MFA-verified) staff session with role
        reception_warden, hostel_admin, or super_admin — library_incharge
        has no grant and receives 403, matching every other staff-only
        leave-request transition. reception_warden/hostel_admin are
        hostel-scoped to the leave request's own student; super_admin is
        unscoped. Requires the leave request to currently be `approved`
        (parent approval genuinely complete) and an explicit
        `identityConfirmed: true` body field — a staff attestation that the
        person at reception has been visually confirmed to match the
        student's identity; this cannot be independently re-verified by the
        server and is never defaulted or inferred. KIIT SAP mentor approval
        is NOT checked by this endpoint: no SAP integration exists anywhere
        in this system, so this endpoint never claims to have verified it —
        see apps/reception-dashboard/docs/exit-authorization.md. At most one
        exit authorization may ever exist per leave request — a second call
        (double-click, retry, or a losing concurrent request) receives 409
        Conflict, enforced by a database-level uniqueness constraint, not
        merely application logic.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExitAuthorizationRequest"
      responses:
        "201":
          description: Exit authorized — the new, immutable exit authorization record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExitAuthorization"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /leave-requests/{leaveRequestId}/return:
    post:
      operationId: recordHostelReturn
      tags: [movements]
      summary: >
        Staff-only: record that a student has physically returned to the
        hostel for an already-exited leave request (Phase 4, Prompt 9 —
        Student Movement Management System, Hostel Return)
      description: >
        Requires an AAL2 (MFA-verified) staff session with role
        reception_warden, hostel_admin, or super_admin — library_incharge
        has no grant and receives 403, matching every other staff-only
        leave-request transition. reception_warden/hostel_admin are
        hostel-scoped to the leave request's own student; super_admin is
        unscoped. Requires the leave request to currently be `approved`
        AND to already have a real exit authorization recorded
        (GET /students/{rollNumber}'s `currentLeave.exitAuthorized`) —
        "Exit Authorized" (a staff attestation) is this system's only
        authoritative record of departure; a return can never be recorded
        for a leave that was never actually exited. At most one hostel
        return may ever exist per leave request — a second call
        (double-click, retry, or a losing concurrent request) receives 409
        Conflict, enforced by a database-level uniqueness constraint, not
        merely application logic. This action is part of the generic
        Movement Engine (packages/db/src/schema/movement.ts) but is the
        ONLY movement type currently implemented.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      responses:
        "201":
          description: Return recorded — the new, immutable movement record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostelReturn"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /emergencies:
    get:
      operationId: listEmergencies
      tags: [emergencies]
      summary: >
        Staff-only: server-side paginated/filtered incident queue (Phase 4,
        Prompt 10 — Emergency Operations Center)
      description: >
        Requires an AAL2 staff session with role reception_warden,
        hostel_admin, or super_admin — library_incharge has no grant.
        reception_warden/hostel_admin are hostel-scoped to their own
        assigned hostel, resolved entirely server-side; super_admin is
        unscoped. Only the 8 EOC emergency categories are ever returned —
        never the separate, still-unbuilt checkpoint-monitoring domain's
        `missed_checkpoint`/`manual_flag` rows. `q` matches a
        case-insensitive PREFIX against the linked student's full_name OR
        roll_number, mirroring `searchStudents`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/EmergencyCategory" }
        - name: severity
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/EmergencySeverity" }
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/EmergencyStatus" }
        - name: activeOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: sortBy
          in: query
          required: false
          schema: { type: string, enum: [reportedAt, severity], default: reportedAt }
        - name: sortDir
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of incidents within the caller's authorized scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: reportEmergency
      tags: [emergencies]
      summary: >
        Staff-only: log a new incident report (Phase 4, Prompt 10)
      description: >
        A genuine, honest reception-desk capability — a staff member records
        an incident they became aware of (phone call, walk-in report, direct
        observation). The intended Student Application "Emergency Trigger"
        producer described in the product roadmap does not exist anywhere in
        this repository (apps/student-mobile is an unmodified template
        scaffold) — this endpoint is not a substitute for that pipeline, it
        is the real staff-attestation path this table's original design
        already established (mirrors the existing `manual_flag` concept).
        `rollNumber` resolves the student server-side, hostel-scoped
        identically to every other staff route — never a client-supplied
        studentId/hostelId/staffId.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rollNumber, category, severity, description]
              additionalProperties: false
              properties:
                rollNumber: { type: string, minLength: 1, maxLength: 100 }
                category: { $ref: "#/components/schemas/EmergencyCategory" }
