        critical: { type: integer }
        newCases: { type: integer }
        monitoring: { type: integer }
        awaitingUpdate: { type: integer }
        admittedToday: { type: integer }
        dischargedToday: { type: integer }

    AuditModule:
      type: string
      description: >
        A normalized, presentation-layer grouping derived server-side from
        each audit_logs row's own `action` prefix (Phase 5, Prompt 12) —
        never a stored column. `staff-auth` covers the staff_sign_in_success/
        mfa_success/mfa_failure/sign_out events; `other` covers any action
        that does not match a known module prefix (fails open to visibility,
        never silently dropped).
      enum: [leave, movement, emergency, health, device, staff-auth, other]

    AuditActorType:
      type: string
      description: The audit_actor_type column's own real values — never invented.
      enum: [student, parent, staff, system]

    AuditEntityType:
      type: string
      description: >
        Every distinct entity_type value any module currently writes,
        confirmed by repository-wide search. trusted_devices and
        device_registration_challenges rows have no hostel concept at all
        and are therefore visible only to super_admin (see GET /audit's
        description).
      enum:
        - leave_requests
        - security_incidents
        - health_cases
        - staff
        - trusted_devices
        - device_registration_challenges

    AuditListItem:
      type: object
      description: >
        One audit_logs row, with hostel/student/actor identity resolved
        server-side via a join back to the owning domain table — never a
        second, duplicated audit store. metadata is passed through
        unmodified from the authoritative row (never edited, never
        enriched with anything the writer didn't record).
      required:
        - id
        - occurredAt
        - action
        - module
        - actorType
        - actorId
        - actorName
        - actorRole
        - entityType
        - entityId
        - studentId
        - studentFullName
        - studentRollNumber
        - hostelId
        - hostelName
        - metadata
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        action: { type: string }
        module: { $ref: "#/components/schemas/AuditModule" }
        actorType: { $ref: "#/components/schemas/AuditActorType" }
        actorId: { type: string, format: uuid, nullable: true }
        actorName: { type: string, nullable: true }
        actorRole: { type: string, nullable: true }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        studentId: { type: string, format: uuid, nullable: true }
        studentFullName: { type: string, nullable: true }
        studentRollNumber: { type: string, nullable: true }
        hostelId: { type: string, format: uuid, nullable: true }
        hostelName: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true

    AuditList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditListItem" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    AuditStatistics:
      type: object
      description: >
        Server-derived, today-scoped event counts, grouped by module — every
        field a fresh aggregate query over the caller's own authorized
        scope, never a client-supplied or cached number.
      required: [eventsToday, byModule]
      properties:
        eventsToday: { type: integer }
        byModule:
          type: object
          required: [leave, movement, emergency, health, device, staff-auth, other]
          properties:
            leave: { type: integer }
            movement: { type: integer }
            emergency: { type: integer }
            health: { type: integer }
            device: { type: integer }
            staff-auth: { type: integer }
            other: { type: integer }

    AnalyticsPresenceSummary:
      type: object
      description: >
        Point-in-time (not period-bound) student presence, reusing
        `DrizzleStudentRepository.getHostelPresenceSummary()` verbatim
        (Phase 4, Prompt 9 remediation) — never re-derived independently.
      required: [totalStudents, studentsInside, studentsOutside]
      properties:
        totalStudents: { type: integer }
        studentsInside: { type: integer }
        studentsOutside: { type: integer }

    AnalyticsLeaveOverview:
      type: object
      description: >
        Every count is derived from a SPECIFIC authoritative event — never
        collapsed into one ambiguous "leave status" number. See
        `apps/api/src/domain/analytics/types.ts`'s `LeaveOverviewSummary`
        doc comment for the exact source/calculation of every field.
      required:
        [
          pendingNow,
          createdInPeriod,
          approvedInPeriod,
          rejectedInPeriod,
          expiredInPeriod,
          approvalRate,
          avgResponseMinutes,
        ]
      properties:
        pendingNow: { type: integer }
        createdInPeriod: { type: integer }
        approvedInPeriod: { type: integer }
        rejectedInPeriod: { type: integer }
        expiredInPeriod: { type: integer }
        approvalRate:
          type: [number, "null"]
          description: >
            approvedInPeriod / (approvedInPeriod + rejectedInPeriod), or
            null if that denominator is 0 — never 0, which would falsely
            claim every decided request was rejected.
        avgResponseMinutes:
          type: [number, "null"]
          description: >
            Average minutes from the "Send for Parent Approval" event to
            the parent's decision event, over requests decided in the
            selected period; null if no such pair exists in the period.

    AnalyticsMovementOverview:
      type: object
      required: [returnsInPeriod, avgDurationMinutes]
      properties:
        returnsInPeriod: { type: integer }
        avgDurationMinutes:
          type: [number, "null"]
          description: >
            Average minutes from exit authorization to hostel return, over
            returns recorded in the selected period; null if unresolvable.

    AnalyticsNotificationOverview:
      type: object
      description: >
        Summarizes the real, persistent `notifications` table (parent/
        student leave-escalation delivery records) — never the Reception
        Dashboard's own client-local Notification Center, which has no
        persistent staff-facing record at all.
      required: [generatedInPeriod, deliveredInPeriod, failedInPeriod]
      properties:
        generatedInPeriod: { type: integer }
        deliveredInPeriod: { type: integer }
        failedInPeriod: { type: integer }

    AnalyticsOverview:
      type: object
      required: [periodFrom, periodTo, presence, leave, movement, notifications]
      properties:
        periodFrom: { type: string, format: date-time }
        periodTo: { type: string, format: date-time }
        presence: { $ref: "#/components/schemas/AnalyticsPresenceSummary" }
        leave: { $ref: "#/components/schemas/AnalyticsLeaveOverview" }
        movement: { $ref: "#/components/schemas/AnalyticsMovementOverview" }
        notifications: { $ref: "#/components/schemas/AnalyticsNotificationOverview" }

    AnalyticsTrendPoint:
      type: object
      description: >
        One UTC calendar day. A day with genuinely zero matching events is
        included with count 0 — a real, server-computed zero, not an
        omission.
      required: [date, count]
      properties:
        date: { type: string, format: date, example: "2026-01-15" }
        count: { type: integer }

    AnalyticsHourBucket:
      type: object
      required: [hour, count]
      properties:
        hour: { type: integer, minimum: 0, maximum: 23 }
        count: { type: integer }

    AnalyticsLeaveTrend:
      type: object
      required: [periodFrom, periodTo, createdByDay, approvedByDay, rejectedByDay]
      properties:
        periodFrom: { type: string, format: date-time }
        periodTo: { type: string, format: date-time }
        createdByDay:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsTrendPoint" }
        approvedByDay:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsTrendPoint" }
        rejectedByDay:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsTrendPoint" }

    AnalyticsMovementTrend:
      type: object
      required: [periodFrom, periodTo, returnsByDay, returnsByHour]
      properties:
        periodFrom: { type: string, format: date-time }
        periodTo: { type: string, format: date-time }
        returnsByDay:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsTrendPoint" }
        returnsByHour:
          type: array
          description: Always exactly 24 entries (hour 0-23), even for an empty period.
          items: { $ref: "#/components/schemas/AnalyticsHourBucket" }

    ReportId:
      type: string
      description: >
        The complete, fixed catalog of reports this platform can produce —
        never a dynamic/client-registered report id.
      enum:
        - operational_summary
        - leave_authorization
        - parent_approval
        - student_movement
        - emergency_incident
        - health_operations
        - notification_activity
        - audit_activity
        - administrative_user_activity
        - configuration_change
        - hostel_occupancy

    ReportFieldDefinition:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }

    ReportFilterDefinition:
      type: object
      required: [id, label, type]
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string, enum: [date_range, multi_select] }
        options:
          type: array
          items: { type: string }
          description: Only present for `multi_select` — the real, fixed set of accepted values.

    ReportSortFieldDefinition:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }

    ReportDefinition:
      type: object
      required:
        - id
        - name
        - category
        - description
        - status
        - availableFields
        - availableFilters
        - sortFields
        - defaultSortField
        - isPaginated
      properties:
        id: { $ref: "#/components/schemas/ReportId" }
        name: { type: string }
        category:
          type: string
          enum: [operations, leave, movement, safety, notifications, compliance, administration]
        description: { type: string }
        status: { type: string, enum: [implemented, unavailable] }
        unavailableReason: { type: string, nullable: true }
        availableFields:
          type: array
          items: { $ref: "#/components/schemas/ReportFieldDefinition" }
        availableFilters:
          type: array
          items: { $ref: "#/components/schemas/ReportFilterDefinition" }
        sortFields:
          type: array
          items: { $ref: "#/components/schemas/ReportSortFieldDefinition" }
        defaultSortField: { type: string }
        isPaginated: { type: boolean }

    ReportFilters:
      type: object
      description: >
        A report's own pre-declared filter values — every key is validated
        server-side against that specific report's `availableFilters`; an
        unrecognized key or value is rejected with 400.
      additionalProperties: true
      properties:
        dateFrom: { type: string, format: date-time }
        dateTo: { type: string, format: date-time }
        statuses: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        severities: { type: array, items: { type: string } }
        eventTypes: { type: array, items: { type: string } }
        modules: { type: array, items: { type: string } }

    ReportPreviewRequest:
      type: object
      required: [reportId]
      properties:
        reportId: { $ref: "#/components/schemas/ReportId" }
        filters: { $ref: "#/components/schemas/ReportFilters" }
        selectedFields:
          type: array
          items: { type: string }
          description: A subset of the report's own `availableFields` ids — omit for every field.
        sortField: { type: string }
        sortDir: { type: string, enum: [asc, desc] }
        page: { type: integer, minimum: 1, default: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 50, default: 20 }

    ReportPreviewResult:
      type: object
      required: [reportId, generatedAt, columns, rows, summary, total, page, pageSize]
      properties:
        reportId: { $ref: "#/components/schemas/ReportId" }
        generatedAt:
          type: string
          format: date-time
          description: >
            The moment this query executed — the closest honest
            approximation of a snapshot timestamp this platform offers, not
            a formal immutable database snapshot/version.
        periodFrom: { type: string, format: date-time, nullable: true }
        periodTo: { type: string, format: date-time, nullable: true }
        columns:
          type: array
          items: { $ref: "#/components/schemas/ReportFieldDefinition" }
        rows:
          type: array
          items: { type: object, additionalProperties: true }
        summary:
          type: object
          nullable: true
          additionalProperties: true
          description: Populated only for the single-row Operational Summary report.
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    ReportTemplate:
      type: object
      required: [id, reportId, name, filters, selectedFields, isFavorite, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        reportId: { $ref: "#/components/schemas/ReportId" }
        name: { type: string }
        filters: { $ref: "#/components/schemas/ReportFilters" }
        selectedFields:
          type: array
          items: { type: string }
        isFavorite: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReportTemplateCreateRequest:
      type: object
      required: [reportId, name]
      properties:
        reportId: { $ref: "#/components/schemas/ReportId" }
        name: { type: string, minLength: 1, maxLength: 120 }
        filters: { $ref: "#/components/schemas/ReportFilters" }
        selectedFields:
          type: array
          items: { type: string }
        isFavorite: { type: boolean, default: false }

    ReportTemplateUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        filters: { $ref: "#/components/schemas/ReportFilters" }
        selectedFields:
          type: array
          items: { type: string }
        isFavorite: { type: boolean }

    ReportHistoryEntry:
      type: object
      required: [id, reportId, filtersSummary, rowCount, generatedAt]
      properties:
        id: { type: string, format: uuid }
        reportId: { $ref: "#/components/schemas/ReportId" }
        filtersSummary: { $ref: "#/components/schemas/ReportFilters" }
        rowCount: { type: integer }
        generatedAt: { type: string, format: date-time }

    StaffAdminRole:
      type: string
