      required:
        - id
        - domain
        - key
        - value
        - valueType
        - description
        - scope
        - hostelId
        - hostelName
        - isActive
        - version
        - createdBy
        - createdByName
        - updatedBy
        - updatedByName
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        domain: { $ref: "#/components/schemas/ConfigurationDomain" }
        key: { type: string }
        value: {}
        valueType: { $ref: "#/components/schemas/ConfigurationValueType" }
        description: { type: string, nullable: true }
        scope: { $ref: "#/components/schemas/ConfigurationScope" }
        hostelId: { type: string, format: uuid, nullable: true }
        hostelName: { type: string, nullable: true }
        isActive: { type: boolean }
        version:
          type: integer
          description: Optimistic-concurrency token — pass back as `expectedVersion` on `PATCH`.
        createdBy: { type: string, format: uuid, nullable: true }
        createdByName: { type: string, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        updatedByName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConfigurationList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConfigurationEntry" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    ConfigurationStatistics:
      type: object
      description: Server-derived counts, within the caller's own hostel scope.
      required: [totalEntries, activeEntries, inactiveEntries, byDomain]
      properties:
        totalEntries: { type: integer }
        activeEntries: { type: integer }
        inactiveEntries: { type: integer }
        byDomain:
          type: object
          required:
            [hostel, approval, movement, emergency, health, notification, system, feature_flags]
          properties:
            hostel: { type: integer }
            approval: { type: integer }
            movement: { type: integer }
            emergency: { type: integer }
            health: { type: integer }
            notification: { type: integer }
            system: { type: integer }
            feature_flags: { type: integer }

    ConfigurationValidationResult:
      type: object
      required: [valid]
      description: >
        `valid: true` iff `kind` was `"valid"`; `reason` is populated only
        for the two outcomes that carry a human-readable explanation
        (`invalid_value`/`invalid_key`) — the others are self-explanatory
        from `kind` alone.
      properties:
        valid: { type: boolean }
        kind:
          type: string
          enum:
            [
              valid,
              invalid_hostel,
              hostel_required_for_scope,
              hostel_not_permitted_for_scope,
              invalid_value,
              invalid_key,
            ]
        reason: { type: string, nullable: true }

  responses:
    Unauthenticated:
      description: Missing, malformed, or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: Authenticated but not authorized for this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: >
        Leave request does not exist, or exists but the caller has no
        relationship to its student (deliberately indistinguishable —
        anti-enumeration).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: Leave request is not in a state that admits this decision
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ValidationError:
      description: Request body/params failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
