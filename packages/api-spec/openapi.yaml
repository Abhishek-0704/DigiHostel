          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditModule" }
        - name: actorType
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditActorType" }
        - name: entityType
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditEntityType" }
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: sortDir
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of audit events within the caller's authorized scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /audit/statistics:
    get:
      operationId: getAuditStatistics
      tags: [audit]
      summary: >
        Staff-only: today's event counts within the caller's scope, by
        module (Phase 5, Prompt 12)
      description: >
        Same authorization/hostel-scope boundary as GET /audit. Every field
        is a fresh aggregate query over the caller's own authorized scope,
        never a client-supplied or cached number.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Real, scope-derived audit statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditStatistics"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: >
        hostel_admin/super_admin-only: Operational Intelligence executive
        overview (Phase 6, Prompt 15)
      description: >
        Reuses the existing `reports:view` permission boundary —
        reception_warden and library_incharge are both denied, matching the
        frontend's own already-established role grants. Every field is a
        fresh aggregate query over the caller's own authorized hostel
        scope, computed from the already-certified Leave/Movement/
        Notification domains' own authoritative tables — never a
        client-supplied, cached, or fabricated number. `dateFrom`/`dateTo`
        default to the trailing 7-day window when omitted; the selected
        range must not exceed 90 days.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Real, scope-derived operational overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /analytics/leave-trend:
    get:
      operationId: getAnalyticsLeaveTrend
      tags: [analytics]
      summary: >
        hostel_admin/super_admin-only: day-bucketed leave-request trend
        (Phase 6, Prompt 15)
      description: >
        Same authorization/hostel-scope/date-range boundary as
        GET /analytics/overview. Each series is derived from a specific,
        named authoritative event (leave request creation, or a real
        `responded` approval-event with the matching outcome) — never a
        single collapsed "leave status" count. Every UTC calendar day in
        the requested range is present in each series, with a genuine
        zero count for a day with no matching events.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Real, scope-derived leave trend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsLeaveTrend"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /analytics/movement-trend:
    get:
      operationId: getAnalyticsMovementTrend
      tags: [analytics]
      summary: >
        hostel_admin/super_admin-only: day- and hour-bucketed hostel-return
        movement trend (Phase 6, Prompt 15)
      description: >
        Same authorization/hostel-scope/date-range boundary as
        GET /analytics/overview. `returnsByHour` is always exactly 24
        entries (0-23, UTC), even for an empty period — a genuine
        distribution over every possible hour, not merely the hours that
        happened to have an event.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Real, scope-derived movement trend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsMovementTrend"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/catalog:
    get:
      operationId: getReportsCatalog
      tags: [reports]
      summary: >
        hostel_admin/super_admin-only: the fixed, server-owned report
        catalog (Phase 6, Prompt 16 — Enterprise Reporting Platform)
      description: >
        Reuses the existing `reports:view` permission boundary — identical
        role grant to Analytics (Phase 6, Prompt 15). Every report's
        available fields/filters/sort options and status
        (implemented/unavailable) are server-derived; a report marked
        `unavailable` carries an honest `unavailableReason` rather than
        being silently omitted.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The full report catalog.
          content:
            application/json:
              schema:
                type: object
                required: [reports]
                properties:
                  reports:
                    type: array
                    items: { $ref: "#/components/schemas/ReportDefinition" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/{reportId}/preview:
    post:
      operationId: previewReport
      tags: [reports]
      summary: >
        hostel_admin/super_admin-only: bounded, server-validated report
        preview (Phase 6, Prompt 16)
      description: >
        A pure read operation over an existing certified domain's own data
        — most reports reuse that domain's own service directly
        (Emergency/Health/Audit/Analytics), never a second access path.
        Hostel scope is always resolved server-side from the caller's own
        staff identity; no `hostelId` field exists anywhere in this
        request. Every filter value is validated against that specific
        report's own server-declared allow-list — an unrecognized filter,
        field, or sort value is rejected with 400, never silently ignored
        or fabricated. Results are bounded (page/pageSize, max 50 per
        page) — never an unbounded dataset. No PDF/XLSX/CSV file is
        generated by this endpoint.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ReportId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportPreviewRequest"
      responses:
        "200":
          description: Bounded report preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPreviewResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The requested report is marked unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /reports/templates:
    get:
      operationId: listReportTemplates
      tags: [reports]
      summary: >
        hostel_admin/super_admin-only: the caller's own saved report
        templates (Phase 6, Prompt 16)
      description: >
        Personal — never organization-wide/shared. Favourites are the same
        template row with `isFavorite: true`, not a second list.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's own templates, favourites first.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/ReportTemplate" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createReportTemplate
      tags: [reports]
      summary: >
        hostel_admin/super_admin-only: save a report configuration as a
        named template
      description: >
        Stores a validated report configuration (report id + selected
        fields + filters) — never arbitrary SQL/field/table names. A
        second template with the same name for the same staff member is
        rejected with 409.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportTemplateCreateRequest"
      responses:
        "201":
          description: Template saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportTemplate" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A template with this name already exists for this staff member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /reports/templates/{templateId}:
    patch:
      operationId: updateReportTemplate
      tags: [reports]
      summary: >
        hostel_admin/super_admin-only: rename/update/favourite the caller's
        own template
      description: Only the owning staff member may update their own template — 404 for any other template id.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportTemplateUpdateRequest"
      responses:
        "200":
          description: Updated template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportTemplate" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A template with this name already exists for this staff member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
    delete:
      operationId: deleteReportTemplate
      tags: [reports]
      summary: >
        hostel_admin/super_admin-only: delete the caller's own template
      description: Only the owning staff member may delete their own template — 404 for any other template id.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /reports/history:
    get:
      operationId: getReportHistory
      tags: [reports]
      summary: >
        hostel_admin/super_admin-only: the caller's own recent report
        executions (Phase 6, Prompt 16)
      description: >
        A minimal execution-history record — which report, when, a filter
        summary, and how many rows it returned. Distinct from a saved
        template (a configuration, not an event) and from a generated
        artifact (no file is ever produced by this platform).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: The caller's own recent report executions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/ReportHistoryEntry" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: >
        super_admin-only: server-side paginated/filtered staff directory
        (Phase 5, Prompt 13 — Identity & Access Administration Center)
      description: >
        Requires an AAL2 super_admin session — the first super_admin-only
        endpoint in this API family (every other staff-facing route uses
        the standard reception_warden/hostel_admin/super_admin set).
        Matches `staff`'s own pre-existing `staff_all_super_admin` RLS
        grant exactly. `q` matches a case-insensitive PREFIX against
        full_name OR email.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: role
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/StaffAdminRole" }
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/StaffAdminStatus" }
        - name: hostelId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: sortDir
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of staff accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createStaff
      tags: [staff]
      summary: >
        super_admin-only: provision a new staff account (Phase 5, Prompt 13)
      description: >
        Creates a real Supabase Auth `auth.users` row via the Admin API
        (no password is generated, stored, or returned by this backend —
        Supabase's own invite email carries a secure link for the new
        staff member to set their own initial password) and, in the same
        logical operation, the corresponding `staff` row. If the `staff`
        insert fails after the auth user was created, the orphaned auth
        user is deleted as a compensating action.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, role, hostelId]
              additionalProperties: false
              properties:
                fullName: { type: string, minLength: 1, maxLength: 200 }
                email: { type: string, format: email, maxLength: 255 }
                role: { $ref: "#/components/schemas/StaffAdminRole" }
                hostelId:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    Required (non-null) for reception_warden/hostel_admin —
                    their entire authority is hostel-scoped. May be null
                    for library_incharge/super_admin.
      responses:
        "201":
          description: The newly created staff account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAdmin"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A staff account with this email already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /staff/statistics:
    get:
      operationId: getStaffStatistics
      tags: [staff]
      summary: "super_admin-only: staff counts by role/status (Phase 5, Prompt 13)"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Real, database-derived staff statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStatistics"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /staff/{staffId}:
    get:
      operationId: getStaff
      tags: [staff]
      summary: "super_admin-only: staff account detail (Phase 5, Prompt 13)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: The staff account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAdmin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /staff/{staffId}/role:
    patch:
      operationId: changeStaffRole
      tags: [staff]
      summary: "super_admin-only: change a staff member's role (Phase 5, Prompt 13)"
      description: >
        Refuses to target the caller's OWN staff id (self-escalation
        defense) and refuses to demote the last remaining active
        super_admin (409).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { $ref: "#/components/schemas/StaffAdminRole" }
      responses:
        "200":
          description: The updated staff account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAdmin"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Self-target or last-active-super_admin protection triggered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /staff/{staffId}/hostel:
    patch:
      operationId: changeStaffHostel
      tags: [staff]
      summary: "super_admin-only: change a staff member's hostel assignment (Phase 5, Prompt 13)"
      description: >
        Refuses to target the caller's OWN staff id. A null hostelId is
        rejected if the target's CURRENT role requires one
        (reception_warden/hostel_admin).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostelId]
              additionalProperties: false
              properties:
                hostelId: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: The updated staff account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAdmin"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /staff/{staffId}/status:
    patch:
      operationId: changeStaffStatus
      tags: [staff]
      summary: "super_admin-only: suspend or reactivate a staff member (Phase 5, Prompt 13)"
      description: >
        Enforcement is request-time, not merely cosmetic: a suspended
        staff member's very next authenticated request fails with 401
        (see `apps/reception-dashboard/docs/identity-admin.md`). Refuses
        to target the caller's OWN staff id and refuses to suspend the
        last remaining active super_admin (409).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { $ref: "#/components/schemas/StaffAdminStatus" }
      responses:
        "200":
          description: The updated staff account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAdmin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Self-target or last-active-super_admin protection triggered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /staff/{staffId}/reset-password:
    post:
      operationId: resetStaffPassword
      tags: [staff]
      summary: >
        super_admin-only: trigger a password-reset email for a staff
        member (Phase 5, Prompt 13)
      description: >
        Triggers Supabase Auth's own password-recovery email — this
        backend never generates, stores, returns, or logs a password.
        Refuses to target the caller's OWN staff id.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "202":
          description: The reset email was triggered.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string } }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /staff/{staffId}/force-sign-out:
    post:
      operationId: forceSignOutStaff
      tags: [staff]
      summary: >
        super_admin-only: revoke every active session for a staff member
        (Phase 5, Prompt 13)
      description: >
        Calls Supabase Auth's Admin API `signOut(userId, "global")` — a
        blunt, whole-account revocation (this SDK surface does not expose
        a per-session list to revoke individually). Refuses to target the
        caller's OWN staff id.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "202":
          description: All sessions for this staff member were revoked.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string } }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /configuration/domains:
    get:
      operationId: listConfigurationDomains
      tags: [configuration]
      summary: "hostel_admin/super_admin: the fixed, application-validated list of configuration domains (Phase 5, Prompt 14)"
      description: >
        A static, server-owned allow-list (`domain` on `configuration_entries`
        is `text`, not a database enum — this endpoint is the actual source
        of truth a client should render as options, never a hard-coded
        frontend copy of the list).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The recognized configuration domains.
          content:
            application/json:
              schema:
                type: object
                required: [domains]
                properties:
                  domains:
                    type: array
                    items: { $ref: "#/components/schemas/ConfigurationDomain" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /configuration/statistics:
    get:
      operationId: getConfigurationStatistics
      tags: [configuration]
      summary: "hostel_admin/super_admin: configuration entry counts by domain, within the caller's scope (Phase 5, Prompt 14)"
      description: >
        hostel_admin sees counts across every global entry plus only their
        own hostel's entries; super_admin is unscoped.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Real, database-derived configuration statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationStatistics"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /configuration/validate:
    post:
      operationId: validateConfiguration
      tags: [configuration]
      summary: "hostel_admin/super_admin: stateless validation preview — never persists anything (Phase 5, Prompt 14)"
      description: >
        Runs the EXACT SAME validation `POST /configuration` applies before
        writing (key format/domain allow-list/value-type consistency/scope-
        hostel consistency/hostel existence) without persisting anything —
        the Configuration Editor's "Preview" step. Does not check
        hostel-scope authorization or duplicate-key conflicts (those depend
        on the specific create/update call this preview does not perform).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, key, value, valueType, scope, hostelId]
              additionalProperties: false
              properties:
                domain: { $ref: "#/components/schemas/ConfigurationDomain" }
                key: { type: string, minLength: 1, maxLength: 100 }
                value: {}
                valueType: { $ref: "#/components/schemas/ConfigurationValueType" }
                scope: { $ref: "#/components/schemas/ConfigurationScope" }
                hostelId: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: The validation result — always 200, even when invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationValidationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /configuration:
    get:
      operationId: listConfiguration
      tags: [configuration]
      summary: "hostel_admin/super_admin: the configuration directory, server-side paginated/filtered/sorted (Phase 5, Prompt 14)"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: domain
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ConfigurationDomain" }
        - name: scope
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ConfigurationScope" }
        - name: hostelId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: isActive
          in: query
          required: false
          schema: { type: boolean }
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: sortDir
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of configuration entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createConfigurationEntry
      tags: [configuration]
      summary: "hostel_admin/super_admin: create a configuration entry (Phase 5, Prompt 14)"
      description: >
        A hostel_admin may only create a `"scope": "hostel"` entry naming
        their OWN hostel — never a global entry, never another hostel's
        (`403`). super_admin is unscoped. Never stores a secret — a
        key/domain resembling password/token/API key/credential is
        rejected (`400`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, key, value, valueType, scope, hostelId]
              additionalProperties: false
              properties:
                domain: { $ref: "#/components/schemas/ConfigurationDomain" }
                key: { type: string, minLength: 1, maxLength: 100 }
                value: {}
                valueType: { $ref: "#/components/schemas/ConfigurationValueType" }
                description: { type: string, maxLength: 2000, nullable: true }
                scope: { $ref: "#/components/schemas/ConfigurationScope" }
                hostelId: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: The newly created configuration entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationEntry"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A configuration entry for this domain/key already exists at this scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /configuration/{entryId}:
    get:
      operationId: getConfigurationEntry
      tags: [configuration]
      summary: "hostel_admin/super_admin: configuration entry detail (Phase 5, Prompt 14)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConfigurationEntryId"
      responses:
        "200":
          description: The configuration entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateConfigurationEntry
      tags: [configuration]
      summary: "hostel_admin/super_admin: update a configuration entry's value/description/active state (Phase 5, Prompt 14)"
      description: >
        Optimistic concurrency: `expectedVersion` must match the entry's
        current `version` or the update is refused (`409`) rather than
        silently overwriting a concurrent change. A hostel_admin may only
        update an entry within their own hostel scope (`403`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ConfigurationEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              additionalProperties: false
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                value: {}
                description: { type: string, maxLength: 2000, nullable: true }
                isActive: { type: boolean }
      responses:
        "200":
          description: The updated configuration entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationEntry"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale version — the entry changed since the caller last read it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth-issued JWT (ADR-014).

  parameters:
    LeaveRequestId:
      name: leaveRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ConfigurationEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthStatus:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: >
            Whatever build identifier the deployment host injects (e.g. a
            git SHA); "unknown" when nothing is set (e.g. local dev).

    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    NotReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [not_ready]

    LeaveRequestStatus:
      type: string
      description: >
        Full state vocabulary already defined by the schema
        (packages/db/src/schema/enums.ts, leave_request_status) — this
        endpoint set only ever produces approved/rejected transitions today;
        the escalation-notification states are included because they are
        part of the same enum, not because this task creates them.
      enum:
        - pending
        - father_notified
        - mother_notified
        - guardian_notified
        - approved
        - rejected
        - in_app_call
        - manual_verification
        - expired

    LeaveRequest:
      type: object
      required: [id, studentId, reason, startDate, endDate, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        reason:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/LeaveRequestStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StaffLeaveQueueItem:
      type: object
      description: >
        A leave_requests row enriched with the minimum student/hostel/room
        context the Reception Dashboard's queue table needs — never a parent
        identity or contact detail (staff have no legitimate reason to see
        that here, docs/rls-policy-matrix.md), and never any KIIT SAP/mentor-
        approval field (no such data source is wired to this endpoint — see
        apps/reception-dashboard/docs/leave-queue.md).
      required:
        - id
        - studentId
        - studentRollNumber
        - studentFullName
        - studentHostelId
        - studentHostelName
        - studentRoomId
        - studentRoomNumber
        - reason
        - startDate
        - endDate
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        studentRollNumber:
          type: string
        studentFullName:
          type: string
        studentHostelId:
          type: string
          format: uuid
          nullable: true
        studentHostelName:
          type: string
          nullable: true
        studentRoomId:
          type: string
          format: uuid
          nullable: true
        studentRoomNumber:
          type: string
          nullable: true
        reason:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/LeaveRequestStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LeaveApprovalEvent:
      type: object
      description: >
        One immutable leave_approval_events row (ADR-015). Deliberately
        excludes any actor identity field — never reveals which specific
        parent/guardian/staff member acted.
      required: [id, eventType, response, biometricConfirmed, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum: [notified, responded, escalated, expired, manual_override]
        response:
          type: string
          enum: [approved, rejected, no_response]
          nullable: true
        biometricConfirmed:
          type: boolean
        occurredAt:
          type: string
          format: date-time

    CreateLeaveRequestBody:
      type: object
      description: >
        Student-supplied leave request fields only — never a student id (the
        authenticated caller's own student profile is always used, resolved
        server-side; docs/leave-approval-workflow.md's Critical Rule).
      required: [reason, startDate, endDate]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    BiometricAssertion:
      type: object
      description: >
        Client-side biometric confirmation assertion (docs/auth-database-security-model.md
        §7) — never raw biometric data. Required before any approve/reject
        decision (SDD Ch.5 §5.2).
      required: [assertionToken, actionId]
      additionalProperties: false
      properties:
        assertionToken:
          type: string
        actionId:
          type: string

    LeaveDecisionRequest:
      type: object
      required: [biometricAssertion]
      additionalProperties: false
      properties:
        biometricAssertion:
          $ref: "#/components/schemas/BiometricAssertion"

    ExitAuthorizationRequest:
      type: object
      description: >
        Phase 3, Prompt 7C. `identityConfirmed` must be the literal `true` —
        a staff attestation that the person at reception has been visually
        confirmed to match the student's identity, never independently
        re-derivable by the server. No other field is accepted: in
        particular, no client-supplied mentorApproved/parentApproved/
        staffId/studentId/hostelId/role/authorizationStatus/exitTimestamp
        value has any effect on authorization, which is resolved entirely
        server-side from the authenticated caller's own staff profile.
      required: [identityConfirmed]
      additionalProperties: false
      properties:
        identityConfirmed:
          type: boolean
          enum: [true]

    ExitAuthorization:
      type: object
      description: >
        One immutable leave_exit_authorizations row — the authoritative
        record that a student physically left the hostel for a specific
        leave request. Deliberately excludes which specific staff member
        authorized it (same actor-identity-omission discipline as
        LeaveApprovalEvent).
      required: [id, leaveRequestId, identityConfirmed, authorizedAt]
      properties:
        id:
          type: string
          format: uuid
        leaveRequestId:
          type: string
          format: uuid
        identityConfirmed:
          type: boolean
        authorizedAt:
          type: string
          format: date-time

    ParentRelationshipType:
      type: string
      description: Mirrors packages/db/src/schema/enums.ts's parent_relationship_type enum.
      enum: [father, mother, guardian]

    StaffAuthEventBody:
      type: object
      description: >
        Only events reportable while still holding a valid bearer token — see
        POST /auth/staff/audit-events's own description.
      required: [event]
      additionalProperties: false
      properties:
        event:
          type: string
          enum: [sign_in_success, mfa_success, mfa_failure, sign_out]

    RequestOtpBody:
      type: object
      description: >
        Deliberately has no phone field of any kind — the authoritative phone
        number is resolved entirely server-side and is never accepted from
        the client (F-02 core requirement).
      required: [rollNumber, relationshipType]
      additionalProperties: false
      properties:
        rollNumber:
          type: string
          minLength: 1
        relationshipType:
          $ref: "#/components/schemas/ParentRelationshipType"

    VerifyOtpBody:
      type: object
      description: >
        Deliberately has no phone field — the phone bound to challengeId is
        resolved server-side.
      required: [challengeId, code]
      additionalProperties: false
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1

    OtpChallenge:
      type: object
      description: >
        Constant shape regardless of eligibility — never reveals whether the
        supplied roll number/relationship is actually registered.
      required: [challengeId]
      properties:
        challengeId:
          type: string
          format: uuid

    DevicePlatform:
      type: string
      description: Mirrors packages/db/src/schema/enums.ts's device_platform enum.
      enum: [android, ios]

    RequestDeviceChallengeBody:
      type: object
      required: [platform]
      additionalProperties: false
      properties:
        platform:
          $ref: "#/components/schemas/DevicePlatform"

    DeviceChallenge:
      type: object
      required: [challengeId, nonce, expiresAt]
      properties:
        challengeId:
          type: string
          format: uuid
        nonce:
          type: string
          description: >
            Pass this exact value into the platform attestation call (e.g.
            Play Integrity's requestHash/nonce parameter) so the resulting
            token is cryptographically bound to this specific challenge.
        expiresAt:
          type: string
          format: date-time

    RegisterDeviceBody:
      type: object
      required: [challengeId, platform, attestationToken, deviceFingerprint]
      additionalProperties: false
      properties:
        challengeId:
          type: string
          format: uuid
        platform:
          $ref: "#/components/schemas/DevicePlatform"
        attestationToken:
          type: string
          minLength: 1
          description: >
            The opaque token the platform attestation API produced (a Play
            Integrity integrity token on Android) — never inspected or
            decoded by the client, only relayed to the backend.
        deviceFingerprint:
          type: string
          minLength: 1
          description: >
            This installation's own random, app-generated identifier
            (services/deviceIdentity — never a hardware serial/IMEI/Android
            ID), used only to recognize the same installation on a future
            listTrustedDevices() call, never as attestation proof itself.

    TrustedDevice:
      type: object
      required: [id, platform, registeredAt]
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: "#/components/schemas/DevicePlatform"
        registeredAt:
          type: string
          format: date-time

    OtpVerificationResult:
      type: object
      description: >
        Real Supabase session tokens — the client adopts these locally via
        supabase.auth.setSession(), never receiving a phone number at any
        point in this flow.
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            currentStatus:
              $ref: "#/components/schemas/LeaveRequestStatus"
            requestId:
              type: string
              description: >-
                Server-generated per-request identifier (F-07 production
                observability). Present on unexpected (5xx) and
                framework-rejected (4xx) errors; hand this value to support
                to correlate a client-visible failure with server-side logs.
                Not present on typed domain errors that routes map to a
                response themselves (e.g. leave-request 404/409).

    StudentSearchResultItem:
      type: object
      description: >
        Deliberately narrower than the full `students` row — never
        `authUserId` (an internal identity-linkage field with no product
        purpose on a staff-facing read surface). No department/program/
        semester/gender/phone/photograph field is represented anywhere in
        this schema — none exists in the authoritative `students` table.
      required: [id, rollNumber, fullName, hostelId, hostelName, roomId, roomNumber]
      properties:
        id:
          type: string
          format: uuid
        rollNumber:
          type: string
        fullName:
          type: string
        hostelId:
          type: string
          format: uuid
          nullable: true
        hostelName:
          type: string
          nullable: true
        roomId:
          type: string
          format: uuid
          nullable: true
        roomNumber:
          type: string
          nullable: true

    StudentSearchResult:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StudentSearchResultItem"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    StudentGuardian:
      type: object
      description: >
        One linked parent/guardian, minimized to exactly what the Student
        Operations Center profile needs — never an internal id or
        authentication identifier.
      required: [fullName, relationshipType, phoneNumber]
      properties:
        fullName:
          type: string
        relationshipType:
          $ref: "#/components/schemas/ParentRelationshipType"
        phoneNumber:
          type: string

    StudentCurrentLeave:
      type: object
      description: >
        The student's own most recent DigiHostel Hostel Leaving Request —
        reused, unmutated, read-only data from the certified Parent
        Approval / Exit Authorization workflow. Never the separate KIIT SAP
        Holiday Request concept.
      required:
        - id
        - status
        - reason
        - startDate
        - endDate
        - createdAt
        - updatedAt
        - exitAuthorized
        - exitAuthorizedAt
        - returnRecorded
        - returnedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LeaveRequestStatus"
        reason:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        exitAuthorized:
          type: boolean
        exitAuthorizedAt:
          type: string
          format: date-time
          nullable: true
        returnRecorded:
          type: boolean
        returnedAt:
          type: string
          format: date-time
          nullable: true

    StudentTimelineEvent:
      type: object
      description: >
        One immutable leave_approval_events row for the student's current
        leave request — same actor-omission discipline as
        LeaveApprovalEvent: never reveals which specific parent/guardian/
        staff member acted.
      required: [id, eventType, response, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum: [notified, responded, escalated, expired, manual_override]
        response:
          type: string
          enum: [approved, rejected, no_response]
          nullable: true
        occurredAt:
          type: string
          format: date-time

    HostelPresence:
      type: string
      description: >
        Server-derived, never persisted. "outside_hostel" iff the student's
        own current leave request is genuinely exit-authorized and has no
        return recorded yet; "inside_hostel" otherwise (including "no leave
        request at all"). Never trust a client-supplied value for this —
        it is computed entirely server-side from leave_exit_authorizations
        and movements (Phase 4, Prompt 9 remediation).
      enum: [inside_hostel, outside_hostel]

    StudentProfile:
      type: object
      required:
        - id
        - rollNumber
        - fullName
        - hostelId
        - hostelName
        - roomId
        - roomNumber
        - guardians
        - currentLeave
        - timeline
        - hostelPresence
      properties:
        id:
          type: string
          format: uuid
        rollNumber:
          type: string
        fullName:
          type: string
        hostelId:
          type: string
          format: uuid
          nullable: true
        hostelName:
          type: string
          nullable: true
        roomId:
          type: string
          format: uuid
          nullable: true
        roomNumber:
          type: string
          nullable: true
        guardians:
          type: array
          items:
            $ref: "#/components/schemas/StudentGuardian"
        currentLeave:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/StudentCurrentLeave"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/StudentTimelineEvent"
        hostelPresence:
          $ref: "#/components/schemas/HostelPresence"

    HostelReturn:
      type: object
      description: >
        A recorded Movement Engine row (movement_type = hostel_return) —
        deliberately narrower than the full `movements` row, never
        `recordedByStaffId` (actor identity is never revealed to a client,
        matching ExitAuthorization's identical discipline).
      required: [id, leaveRequestId, studentId, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        leaveRequestId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time

    EmergencyCategory:
      type: string
      description: >
        The 8 categories added to security_incident_type for the Emergency
        Operations Center (Phase 4, Prompt 10). The table's original two
        values (missed_checkpoint, manual_flag) belong to the separate,
        still-unbuilt Digital Library Pass checkpoint-monitoring domain and
        are never returned/accepted here.
      enum:
        - medical
        - personal_safety
        - fire
        - security_threat
        - violence
        - infrastructure
        - harassment
        - other

    EmergencySeverity:
      type: string
      enum: [critical, high, medium, low, informational]

    EmergencyStatus:
      type: string
      description: >
        The EOC's own 5-state lifecycle. `escalated` (a value that exists on
        the underlying column for the separate checkpoint-monitoring domain)
        is deliberately not part of this API's vocabulary — no concrete EOC
        requirement justifies exposing it.
      enum: [open, acknowledged, in_progress, resolved, closed]

    EmergencyEventType:
      type: string
      enum: [created, acknowledged, response_started, note_added, resolved, closed]

