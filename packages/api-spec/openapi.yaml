            library_incharge: { type: integer }
            hostel_admin: { type: integer }
            super_admin: { type: integer }

    ConfigurationDomain:
      type: string
      description: >
        Phase 5, Prompt 14 — the fixed, application-validated allow-list
        (`configuration_entries.domain` is `text`, not a database enum;
