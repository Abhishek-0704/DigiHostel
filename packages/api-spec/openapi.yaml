openapi: 3.1.0
info:
  title: DigiHostel API
  version: 0.1.0
  description: >
    Source contract for the DigiHostel API (ADR-007). Health check plus the
    first two real business workflows, Parent Leave Approval and Student Leave
    Request creation/viewing (docs/leave-approval-workflow.md).
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness check — is this process alive
      description: >
        Never touches the database — stays correct even if Postgres is
        briefly unreachable. This is the endpoint a deployment host's own
        container-restart health check should target (F-06).
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check — can this instance serve production traffic
      description: >
        Verifies the one dependency every route and every pg-boss worker
        shares (Postgres), via a trivial query — never a business query
        (F-06). Never returns the underlying error's message/stack.
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: Not ready — a required dependency is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyStatus"

  /auth/otp/request:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: >
        Request an OTP for parent/guardian login (F-02 remediation, ADR-020's
        required eligibility pre-check)
      description: >
        Resolves rollNumber + relationshipType to an authoritative parent
        phone number server-side and, if eligible, dispatches an OTP to it.
        The response is always the same shape regardless of eligibility
        (anti-enumeration) — the client never learns whether a given roll
        number/relationship is registered. No phone number is ever accepted
        from or returned to the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpBody"
      responses:
        "200":
          description: >
            A challenge id was issued — this does NOT necessarily mean an OTP
            was actually sent (see description)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify an OTP challenge and obtain a Supabase session
      description: >
        Verifies the code against the phone number bound to challengeId
        server-side. On success, returns real Supabase session tokens for the
        client to adopt via supabase.auth.setSession() — the client never
        calls Supabase's own OTP endpoints directly. Never distinguishes an
        unknown/expired/exhausted/ineligible challenge from a genuinely wrong
        code — all fail identically (anti-enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpBody"
      responses:
        "200":
          description: Verified — a real Supabase session for the client to adopt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerificationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid or expired code, or an unknown/exhausted/ineligible challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /leave-requests:
    post:
      operationId: createLeaveRequest
      tags: [leave]
      summary: Create a leave request (authenticated student, for themselves only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeaveRequestBody"
      responses:
        "201":
          description: Created — the new leave request in its initial (pending) state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      operationId: listLeaveRequests
      tags: [leave]
      summary: >
        List leave requests visible to the authenticated caller — their own
        (student), or every linked student's (parent/guardian, G-05)
      description: >
        Scope is derived entirely from the authenticated caller's own
        resolved profile, never a client-supplied filter. An authenticated
        student receives only their own requests. An authenticated
        parent/guardian receives every leave request belonging to a student
        they have a `parent_student_relationships` link to (any
        relationship_type, per ADR-016 Model C — escalation order does not
        restrict visibility). An unrelated/unlinked parent receives an empty
        array, not an error — there is no id parameter here for a caller to
        probe, so no anti-enumeration handling applies (unlike
        GET /leave-requests/{leaveRequestId}). Any other authenticated role
        (staff) receives 403.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: >
            The caller's own (student) or linked students' (parent/guardian)
            leave requests, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /leave-requests/{leaveRequestId}:
    get:
      operationId: getLeaveRequest
      tags: [leave]
      summary: >
        Get a leave request — authenticated owning student, or authenticated
        parent/guardian (relationship-checked)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      responses:
        "200":
          description: The leave request, if the caller is authorized to see it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /leave-requests/{leaveRequestId}/events:
    get:
      operationId: listLeaveRequestEvents
      tags: [leave]
      summary: >
        Get a leave request's immutable approval-event timeline (Approval
        History) — authenticated owning student, or authenticated
        parent/guardian (relationship-checked). Same authorization/anti-
        enumeration shape as GET /leave-requests/{leaveRequestId}.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      responses:
        "200":
          description: >
            The leave request's approval events, oldest first. Never includes
            which specific parent/guardian/staff member acted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveApprovalEvent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /leave-requests/{leaveRequestId}/approve:
    post:
      operationId: approveLeaveRequest
      tags: [leave]
      summary: Approve a leave request
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveDecisionRequest"
      responses:
        "200":
          description: Approved — the leave request's authoritative new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /leave-requests/{leaveRequestId}/reject:
    post:
      operationId: rejectLeaveRequest
      tags: [leave]
      summary: Reject a leave request
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveDecisionRequest"
      responses:
        "200":
          description: Rejected — the leave request's authoritative new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /leave-requests/{leaveRequestId}/expire:
    post:
      operationId: expireLeaveRequest
      tags: [leave]
      summary: >
        Staff-only: explicitly mark a leave request expired from
        manual_verification (ADR-019 §2). Never automatic — no scheduled job
        may perform this transition.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/LeaveRequestId"
      responses:
        "200":
          description: Expired — the leave request's authoritative new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth-issued JWT (ADR-014).

  parameters:
    LeaveRequestId:
      name: leaveRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthStatus:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: >
            Whatever build identifier the deployment host injects (e.g. a
            git SHA); "unknown" when nothing is set (e.g. local dev).

    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    NotReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [not_ready]

    LeaveRequestStatus:
      type: string
      description: >
        Full state vocabulary already defined by the schema
        (packages/db/src/schema/enums.ts, leave_request_status) — this
        endpoint set only ever produces approved/rejected transitions today;
        the escalation-notification states are included because they are
        part of the same enum, not because this task creates them.
      enum:
        - pending
        - father_notified
        - mother_notified
        - guardian_notified
        - approved
        - rejected
        - in_app_call
        - manual_verification
        - expired

    LeaveRequest:
      type: object
      required: [id, studentId, reason, startDate, endDate, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        reason:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/LeaveRequestStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LeaveApprovalEvent:
      type: object
      description: >
        One immutable leave_approval_events row (ADR-015). Deliberately
        excludes any actor identity field — never reveals which specific
        parent/guardian/staff member acted.
      required: [id, eventType, response, biometricConfirmed, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum: [notified, responded, escalated, expired, manual_override]
        response:
          type: string
          enum: [approved, rejected, no_response]
          nullable: true
        biometricConfirmed:
          type: boolean
        occurredAt:
          type: string
          format: date-time

    CreateLeaveRequestBody:
      type: object
      description: >
        Student-supplied leave request fields only — never a student id (the
        authenticated caller's own student profile is always used, resolved
        server-side; docs/leave-approval-workflow.md's Critical Rule).
      required: [reason, startDate, endDate]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    BiometricAssertion:
      type: object
      description: >
        Client-side biometric confirmation assertion (docs/auth-database-security-model.md
        §7) — never raw biometric data. Required before any approve/reject
        decision (SDD Ch.5 §5.2).
      required: [assertionToken, actionId]
      additionalProperties: false
      properties:
        assertionToken:
          type: string
        actionId:
          type: string

    LeaveDecisionRequest:
      type: object
      required: [biometricAssertion]
      additionalProperties: false
      properties:
        biometricAssertion:
          $ref: "#/components/schemas/BiometricAssertion"

    ParentRelationshipType:
      type: string
      description: Mirrors packages/db/src/schema/enums.ts's parent_relationship_type enum.
      enum: [father, mother, guardian]

    RequestOtpBody:
      type: object
      description: >
        Deliberately has no phone field of any kind — the authoritative phone
        number is resolved entirely server-side and is never accepted from
        the client (F-02 core requirement).
      required: [rollNumber, relationshipType]
      additionalProperties: false
      properties:
        rollNumber:
          type: string
          minLength: 1
        relationshipType:
          $ref: "#/components/schemas/ParentRelationshipType"

    VerifyOtpBody:
      type: object
      description: >
        Deliberately has no phone field — the phone bound to challengeId is
        resolved server-side.
      required: [challengeId, code]
      additionalProperties: false
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1

    OtpChallenge:
      type: object
      description: >
        Constant shape regardless of eligibility — never reveals whether the
        supplied roll number/relationship is actually registered.
      required: [challengeId]
      properties:
        challengeId:
          type: string
          format: uuid

    OtpVerificationResult:
      type: object
      description: >
        Real Supabase session tokens — the client adopts these locally via
        supabase.auth.setSession(), never receiving a phone number at any
        point in this flow.
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            currentStatus:
              $ref: "#/components/schemas/LeaveRequestStatus"
            requestId:
              type: string
              description: >-
                Server-generated per-request identifier (F-07 production
                observability). Present on unexpected (5xx) and
                framework-rejected (4xx) errors; hand this value to support
                to correlate a client-visible failure with server-side logs.
                Not present on typed domain errors that routes map to a
                response themselves (e.g. leave-request 404/409).

  responses:
    Unauthenticated:
      description: Missing, malformed, or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: Authenticated but not authorized for this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: >
        Leave request does not exist, or exists but the caller has no
        relationship to its student (deliberately indistinguishable —
        anti-enumeration).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: Leave request is not in a state that admits this decision
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ValidationError:
      description: Request body/params failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
