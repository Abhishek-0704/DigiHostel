      enum: [hostel, approval, movement, emergency, health, notification, system, feature_flags]

    ConfigurationScope:
      type: string
      enum: [global, hostel]

    ConfigurationValueType:
      type: string
      description: Drives server-side value validation and the editor's type-aware input control.
      enum: [string, number, boolean, json]

    ConfigurationEntry:
      type: object
      description: >
        One `configuration_entries` row. `value`'s JSON shape is validated
