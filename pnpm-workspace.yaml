# Supply-chain security: require published packages to have existed for at least
# 1 day before pnpm will install them, guarding against just-published malicious
# versions. See pnpm docs for `minimumReleaseAge`.
minimumReleaseAge: 1440

# esbuild's install script only selects the correct prebuilt platform binary
# (well-known, widely audited behavior) — pre-approved here so `pnpm install`
# does not require an interactive build-script approval step for it.
#
# @scarf/scarf is a transitive dependency's telemetry-only postinstall
# (a "phone home" usage-analytics beacon, not required for anything to
# function) — deliberately declined, not merely unapproved.
allowBuilds:
  esbuild: true
  "@scarf/scarf": false

packages:
  - apps/*
  - packages/*
